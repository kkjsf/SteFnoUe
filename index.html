const oct=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ouvrir(mdp){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(mdp),'PBKDF2',false,['deriveKey']);
  const cle=await crypto.subtle.deriveKey({name:'PBKDF2',salt:oct(D.sel),iterations:D.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:oct(D.iv)},cle,oct(D.c)));
  document.open();document.write(html);document.close();}
const lu=()=>{try{return localStorage.getItem('maquette_mdp');}catch(e){return null;}};
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('m').value,msg=document.getElementById('msg');
  const garder=document.getElementById('s').checked;b.disabled=true;msg.textContent='';
  try{await ouvrir(m);try{if(garder)localStorage.setItem('maquette_mdp',m);}catch(e){}}
  catch(err){b.disabled=false;msg.textContent=window.crypto&&crypto.subtle?'Mot de passe incorrect.':'Ce navigateur ne sait pas déchiffrer la page (ouvrir le lien en https).';}});
if(lu())ouvrir(lu()).catch(()=>{try{localStorage.removeItem('maquette_mdp');}catch(e){}});
